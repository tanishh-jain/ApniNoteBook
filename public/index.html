<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary Meta Tags -->
    <title>ApniNoteBook - Secure, AI‑powered Cloud Notes</title>
    <meta name="keywords"
      content="cloud note‑taking, AI notes, secure notebook, voice input, handwriting recognition, note translation, export PDF, export DOCX, export CSV, export JSON, export TXT, sync notes, lifetime access" />

   <meta name="keywords"
      content="cloud note‑taking, AI notes, secure notebook, voice input, handwriting recognition, note translation, export PDF, export DOCX, export CSV, export JSON, export TXT, sync notes, lifetime access" />

    <meta name="author" content="Tanish Jain" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#000000" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://apninotebook.in/" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon.png" sizes="48x48" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#2b5797">
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

    <!-- Preload Critical Assets -->
    <link rel="preload" href="/static/css/main.css" as="style">
    <link rel="preload" href="/hero-bg.jpg" as="image">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://apninotebook.in/" />
    <meta property="og:title" content="ApniNoteBook - Secure Cloud Notes with AI" />
    <meta property="og:description" content="Upload, edit, and organize your notes with AI assistance. Voice & handwriting input. Download in PDF, DOCX, CSV, JSON & TXT. Only ₹999 for lifetime access!" />
    <meta property="og:image" content="https://apninotebook.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://apninotebook.in/" />
    <meta name="twitter:title" content="ApniNoteBook - AI Cloud Notes" />
    <meta name="twitter:description" content="AI‑powered notes with upload, translation, and multiple export options." />
    <meta name="twitter:image" content="https://apninotebook.in/og-image.jpg" />
    <!-- Optional: add your Twitter handle -->
    <!-- <meta name="twitter:site" content="@your_handle" /> -->

    <!-- PWA / Mobile‑Web‑App Capable -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ApniNoteBook">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Structured Data: Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ApniNoteBook",
      "url": "https://apninotebook.in/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://apninotebook.in/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ApniNoteBook",
      "url": "https://apninotebook.in/",
      "logo": "https://apninotebook.in/favicon-32x32.png"
    }
    </script>

    <!-- Structured Data: Product (Lifetime Plan) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "Product",
      "name": "ApniNoteBook",
      "image": "https://apninotebook.in/og-image.jpg",
      "description": "AI-powered cloud notebook with handwriting, voice, translation, and export options.",
      "brand": {
        "@type": "Brand",
        "name": "ApniNoteBook"
      },
      "offers": {
        "@type": "Offer",
        "priceCurrency": "INR",
        "price": "999",
        "availability": "https://schema.org/InStock",
        "url": "https://apninotebook.in/"
      }
    }
    </script>

    <!-- Lightweight Analytics (Plausible) -->
    <script async defer data-domain="apninotebook.in" src="https://plausible.io/js/plausible.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Arial&family=Caveat&family=Indie+Flower&family=Lobster&family=Lora&family=Merriweather&family=Open+Sans&family=Pacifico&family=Roboto&family=Shadows+Into+Light&display=swap" rel="stylesheet">

    <!-- Other Scripts & Bundles -->
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js/dist/html2pdf.bundle.min.js"></script>
    <script defer src="https://kit.fontawesome.com/461f0103af.js" crossorigin="anonymous"></script>
  </head>

      crossorigin="anonymous"
    ></script>

    <script async src="https://docs.opencv.org/4.5.5/opencv.js" onload="onOpenCVLoaded()"></script>

</html>
